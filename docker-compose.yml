# Microservicio de persistencia detrás del Traefik compartido.
#
# MongoDB, Traefik y la red `mired` se proporcionan desde D:\Services.
#
# Inicio:
#     docker compose up --build -d
#
# El servicio también se publica en el puerto que espera el orquestador
# (`PERSISTENCE_BASE_URL = http://localhost:8082`):
#     curl http://localhost:8082/health
#
# El Traefik compartido lo enruta mediante TLS:
#     curl -k https://persistence.universidad.localhost/health
#
# PERSISTENCE_API_TOKEN es el nombre canónico del secreto compartido (también
# lo usa el orquestador); SERVICE_API_TOKEN se acepta como alias anterior. El
# valor se obtiene del archivo `.env` junto a este compose.

services:
  persistence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Publicado directamente para el orquestador: PERSISTENCE_BASE_URL apunta
      # a http://localhost:8082. El Traefik compartido también enruta el servicio.
      - "8082:8000"
    environment:
      # Nombre canónico del secreto; el alias anterior sigue funcionando como respaldo.
      PERSISTENCE_API_TOKEN: ${PERSISTENCE_API_TOKEN:-${SERVICE_API_TOKEN:?PERSISTENCE_API_TOKEN is required; copy .env.example to .env and set it}}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-pdf_extractext}
      MONGO_TEXTS_COLLECTION: ${MONGO_TEXTS_COLLECTION:-texts}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-5000}
      MAX_TEXT_BODY_BYTES: ${MAX_TEXT_BODY_BYTES:-10485760}
      APP_NAME: ${APP_NAME:-Persistence Microservice}
    labels:
      - traefik.enable=true
      - traefik.http.routers.persistence.rule=Host(`persistence.universidad.localhost`)
      - traefik.http.routers.persistence.entrypoints=https
      - traefik.http.routers.persistence.tls=true
      - traefik.http.services.persistence.loadbalancer.server.port=8000
      - traefik.docker.network=mired
    networks:
      - mired
    restart: unless-stopped
    # Docker envía SIGTERM a uvicorn y espera este tiempo antes de enviar SIGKILL.
    # Debe superar --timeout-graceful-shutdown de uvicorn (20 s) para que terminen
    # las solicitudes en curso y se cierre correctamente el pool de Mongo.
    stop_grace_period: 30s

networks:
  mired:
    external: true
    name: mired
