# Microservicio de persistence detrás del Traefik compartido.

## Traefik compartido ──► persistence (:8000)
# MongoDB compartido ──► persistence, a través de mired

# MongoDB, Traefik y la red `mired` son proporcionados por D:\Services.
#
# Inicio:
#     docker compose up --build -d
#
# El servicio también se publica en el host en el puerto que el orquestador
# espera (`PERSISTENCE_BASE_URL = http://localhost:8082`):
#     curl http://localhost:8082/health
#
# El Traefik compartido lo enruta a través de TLS:
#     curl -k https://persistence.universidad.localhost/health
#
# PERSISTENCE_API_TOKEN es el nombre canónico del secreto compartido (el
# orquestador también lo usa); SERVICE_API_TOKEN todavía se acepta como un alias
# heredado (legacy). Proviene del archivo `.env` junto a este archivo compose.

services:
  persistence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8000"
    environment:
      PERSISTENCE_API_TOKEN: ${PERSISTENCE_API_TOKEN:-${SERVICE_API_TOKEN:?PERSISTENCE_API_TOKEN is required; copy .env.example to .env and set it}}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_DATABASE: ${MONGO_DATABASE:-pdf_extractext}
      MONGO_TEXTS_COLLECTION: ${MONGO_TEXTS_COLLECTION:-texts}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-5000}
      MAX_TEXT_BODY_BYTES: ${MAX_TEXT_BODY_BYTES:-10485760}
      APP_NAME: ${APP_NAME:-Persistence Microservice}
    labels:
      - traefik.enable=true
      - traefik.http.routers.persistence.rule=Host(`persistence.universidad.localhost`)
      - traefik.http.routers.persistence.entrypoints=https
      - traefik.http.routers.persistence.tls=true
      - traefik.http.services.persistence.loadbalancer.server.port=8000
      - traefik.docker.network=mired
    networks:
      - mired
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  mired:
    external: true
    name: mired
